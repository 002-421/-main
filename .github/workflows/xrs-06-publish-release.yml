name: XRS Stable release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run Windows build and release preflight only; never publish Stable'
        required: true
        type: choice
        default: preflight
        options: [preflight]

permissions:
  contents: read

concurrency:
  group: xrs-stable-release
  cancel-in-progress: false

jobs:
  windows-candidate:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       contains(github.event.pull_request.labels.*.name, 'xrs-release-approved')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight')
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: x-ray-report-studio
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved release event and source version
        id: release
        shell: pwsh
        run: |
          $sourceVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($sourceVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Stable release PR must set a numeric MAJOR.MINOR.PATCH version; got $sourceVersion" }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $labels = (Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).pull_request.labels.name
            if ($env:GITHUB_BASE_REF -ne 'main' -or -not $labels.Contains('xrs-release-approved')) { throw 'A merged release PR with xrs-release-approved label is required.' }
          }
          "version=$sourceVersion" | Add-Content $env:GITHUB_OUTPUT -Encoding utf8
          "Release version: $sourceVersion"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: x-ray-report-studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Targeted Stable updater tests
        run: node --test tests/update-channel.test.mjs tests/update-version.test.mjs tests/update-install.test.mjs tests/update-settings.test.mjs tests/user-data-backup.test.mjs tests/log-safety.test.mjs tests/windows-integration.test.mjs
      - name: Package and verify Windows Setup ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python scripts/package_setup.py --candidate-output test-output/stable-release --candidate-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = 'test-output/stable-release/X-ray_Report_Studio_Windows_Setup.zip'
          python scripts/verify_setup_package.py --zip $archive --source-electron electron --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path 'test-output/stable-release/SHA256SUMS.txt' -Value "$hash  X-ray_Report_Studio_Windows_Setup.zip" -NoNewline
          "Candidate version: $env:RELEASE_VERSION" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Setup ZIP SHA-256: $hash" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Setup ZIP bytes: $((Get-Item $archive).Length)" | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "Verified Setup ZIP SHA-256: $hash"
      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: xrs-stable-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            x-ray-report-studio/test-output/stable-release/X-ray_Report_Studio_Windows_Setup.zip
            x-ray-report-studio/test-output/stable-release/SHA256SUMS.txt

  publish-stable:
    needs: windows-candidate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && contains(github.event.pull_request.labels.*.name, 'xrs-release-approved') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: xrs-stable-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: xrs-stable-release-${{ github.run_id }}
          path: ${{ runner.temp }}/xrs-candidate
      - name: Verify candidate and current public Stable rollback version
        id: baseline
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-candidate
          RUNNER_TEMP: ${{ runner.temp }}
          RELEASE_VERSION: ${{ needs.windows-candidate.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,re,urllib.request,zipfile
          from urllib.parse import urlparse
          version=os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+',version), 'Release version has an unsupported format'
          root=pathlib.Path(os.environ['CANDIDATE_DIR'])
          archives=list(root.rglob('X-ray_Report_Studio_Windows_Setup.zip')); sums=list(root.rglob('SHA256SUMS.txt'))
          assert len(archives)==1 and len(sums)==1, 'Expected one Setup ZIP and SHA256SUMS.txt'
          candidate=archives[0]; payload=candidate.read_bytes(); digest=hashlib.sha256(payload).hexdigest()
          assert sums[0].read_text().strip()==f'{digest}  X-ray_Report_Studio_Windows_Setup.zip', 'Windows ZIP SHA-256 record does not match archive bytes'
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert z.testzip() is None, 'Release ZIP is corrupt'
              root_name='X-ray Report Studio Setup/app/'; names=set(z.namelist())
              package=json.loads(z.read(root_name+'package.json'))
              assert package.get('version')==version and package.get('main')=='electron/main.cjs', 'ZIP app version or entry point mismatch'
              assert root_name+'dist/index.html' in names and root_name+'electron/main.cjs' in names, 'Required Electron app files missing'
              modules={n[len(root_name+'electron/'):] for n in names if n.startswith(root_name+'electron/') and n.endswith('.cjs')}
              for name in modules:
                  source=z.read(root_name+'electron/'+name).decode('utf-8')
                  for req in re.findall(r"\brequire\s*\(\s*['\"](\./[^'\"]+)['\"]\s*\)",source):
                      target=req[2:]; options=[target] if target.endswith('.cjs') else [target+'.cjs',target+'/index.cjs']
                      assert any(x in modules for x in options), f'{name} requires missing local module {req}'
          run_id=os.environ['GITHUB_RUN_ID']
          def get(url):
              separator='&' if '?' in url else '?'
              with urllib.request.urlopen(urllib.request.Request(url+separator+'xrs-verify='+digest+'-'+run_id,headers={'User-Agent':'xrs-stable-release','Cache-Control':'no-cache'}),timeout=120) as r:return r.read()
          manifest_url='https://raw.githubusercontent.com/002-421/-main/codex/mri-report-studio/x-ray-report-studio/downloads/latest.json'
          old=json.loads(get(manifest_url)); old_version=old.get('version')
          assert re.fullmatch(r'\d+\.\d+\.\d+',str(old_version)), 'Current Stable version is invalid'
          assert tuple(map(int,version.split('.'))) > tuple(map(int,old_version.split('.'))), 'Release must move Stable forward; downgrade refused'
          parsed=urlparse(old.get('url',''))
          allowed_prefix='/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/'
          archive_name=parsed.path.rsplit('/',1)[-1]
          assert parsed.scheme=='https' and parsed.hostname=='github.com' and parsed.path.startswith(allowed_prefix) and re.fullmatch(r'X-ray_Report_Studio_Windows_Setup(?:-\d+\.\d+\.\d+)?\.zip',archive_name), 'Current Stable archive URL is not recognized'
          canonical_url='https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip'
          assert old.get('url')==canonical_url, 'Current Stable manifest is not using the canonical URL required by installed clients'
          old_zip=get(old['url']); old_sha=hashlib.sha256(old_zip).hexdigest()
          assert old_sha==old.get('sha256'), 'Current Stable ZIP does not match its manifest'
          with zipfile.ZipFile(io.BytesIO(old_zip)) as z:
              assert z.testzip() is None, 'Current Stable rollback ZIP is corrupt'
              old_app=json.loads(z.read('X-ray Report Studio Setup/app/package.json'))
              assert old_app.get('version')==old_version, 'Current Stable ZIP version does not match its manifest'
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp/'xrs-previous.zip').write_bytes(old_zip)
          (temp/'xrs-previous.json').write_text(json.dumps(old,indent=2)+'\n',encoding='utf-8')
          (temp/'xrs-candidate-sha256.txt').write_text(digest+'\n',encoding='ascii')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'old_version={old_version}\nnew_version={version}\n')
          print(f'Windows ZIP verified: version={version}, bytes={len(payload)}, SHA-256={digest}')
          print(f'Rollback ZIP verified: version={old_version}, bytes={len(old_zip)}, SHA-256={old_sha}')
          PY
      - name: Checkout official Stable channel
        id: official
        uses: actions/checkout@v4
        with:
          ref: codex/mri-report-studio
          path: official
          persist-credentials: true
      - name: Stage immutable archives and rollback backup
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-candidate
          RUNNER_TEMP: ${{ runner.temp }}
          RELEASE_VERSION: ${{ steps.baseline.outputs.new_version }}
          OLD_VERSION: ${{ steps.baseline.outputs.old_version }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          downloads=pathlib.Path('official/x-ray-report-studio/downloads'); downloads.mkdir(parents=True,exist_ok=True)
          version=os.environ['RELEASE_VERSION']; previous=os.environ['OLD_VERSION']; temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          old_zip=temp/'xrs-previous.zip'; old_manifest=json.loads((temp/'xrs-previous.json').read_text())
          candidate=next(pathlib.Path(os.environ['CANDIDATE_DIR']).rglob('X-ray_Report_Studio_Windows_Setup.zip'))
          digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          def preserve(name,source,kind):
              target=downloads/name
              if target.exists():
                  if kind=='zip': assert hashlib.sha256(target.read_bytes()).digest()==hashlib.sha256(source.read_bytes()).digest(), f'Existing rollback ZIP differs: {name}'
                  else:
                      saved=json.loads(target.read_text()); assert saved.get('version')==previous and saved.get('sha256')==old_manifest.get('sha256'), 'Existing rollback manifest differs'
              else: shutil.copyfile(source,target)
          preserve(f'X-ray_Report_Studio_Windows_Setup-{previous}.zip',old_zip,'zip')
          preserve(f'latest-{previous}-before-{version}.json',temp/'xrs-previous.json','json')
          target=downloads/f'X-ray_Report_Studio_Windows_Setup-{version}.zip'
          if target.exists(): assert hashlib.sha256(target.read_bytes()).hexdigest()==digest, 'Existing versioned release ZIP differs'
          else: shutil.copyfile(candidate,target)
          print('Prepared rollback and candidate archives; Stable remains on its previous version until final activation.')
          PY
          git -C official config user.name 'github-actions[bot]'
          git -C official config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C official add -f -- x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup-${{ steps.baseline.outputs.old_version }}.zip x-ray-report-studio/downloads/latest-${{ steps.baseline.outputs.old_version }}-before-${{ steps.baseline.outputs.new_version }}.json x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup-${{ steps.baseline.outputs.new_version }}.zip
          if git -C official diff --cached --quiet; then echo 'Release staging is already present.'; else git -C official commit -m "release(xrs): stage ${{ steps.baseline.outputs.new_version }} and preserve ${{ steps.baseline.outputs.old_version }}"; git -C official push origin HEAD:refs/heads/codex/mri-report-studio; fi
      - name: Verify public versioned archives before Stable activation
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_VERSION: ${{ steps.baseline.outputs.new_version }}
          OLD_VERSION: ${{ steps.baseline.outputs.old_version }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          from urllib.parse import urlparse
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); version=os.environ['RELEASE_VERSION']; old=os.environ['OLD_VERSION']
          expected=(temp/'xrs-candidate-sha256.txt').read_text().strip()
          base='https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/'
          previous=json.loads((temp/'xrs-previous.json').read_text())
          for name,digest in [(f'X-ray_Report_Studio_Windows_Setup-{old}.zip',previous['sha256']),(f'X-ray_Report_Studio_Windows_Setup-{version}.zip',expected)]:
              ok=False
              for i in range(12):
                  try:
                      with urllib.request.urlopen(base+name+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(i),timeout=120) as r:data=r.read()
                      if hashlib.sha256(data).hexdigest()==digest:ok=True;break
                  except Exception as e: print('Archive propagation pending:',type(e).__name__)
                  time.sleep(10)
              assert ok, f'Public archive failed SHA-256 verification: {name}'
          manifest_url='https://raw.githubusercontent.com/002-421/-main/codex/mri-report-studio/x-ray-report-studio/downloads/latest.json'
          live=None
          for i in range(12):
              try:
                  with urllib.request.urlopen(manifest_url+'?verify=staged-'+os.environ['GITHUB_RUN_ID']+'-'+str(i),timeout=60) as r:current=json.load(r)
                  if current.get('version')==old and current.get('sha256')==previous.get('sha256') and current.get('url')=='https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip':
                      live=current;break
                  print('Waiting for public previous-version manifest propagation:',current.get('version'),current.get('url'))
              except Exception as e: print('Previous manifest propagation pending:',type(e).__name__)
              time.sleep(10)
          assert live is not None, 'Previous Stable manifest is not safely active after bounded propagation checks'
          print(f'Verified public rollback {old} and candidate {version}; latest.json still selects {old}.')
          PY
      - name: Create immutable version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows-candidate.outputs.version }}
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-candidate
        run: |
          set -euo pipefail
          tag="xrs-v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release tag ${tag}." >&2
            exit 1
          fi
          archive="$(find "$CANDIDATE_DIR" -name X-ray_Report_Studio_Windows_Setup.zip -type f -print -quit)"
          test -n "$archive"
          git tag -a "$tag" "$SOURCE_SHA" -m "X-ray Report Studio ${RELEASE_VERSION}"
          git push origin "refs/tags/${tag}"
          gh release create "$tag" "$archive" \
            --title "X-ray Report Studio ${RELEASE_VERSION}" \
            --notes "Stable Windows release ${RELEASE_VERSION}. Installer SHA-256 is recorded in the workflow run summary."
      - name: Publish canonical ZIP while previous manifest remains active
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          RELEASE_VERSION: ${{ steps.baseline.outputs.new_version }}
          OLD_VERSION: ${{ steps.baseline.outputs.old_version }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); version=os.environ['RELEASE_VERSION']
          candidate=next(pathlib.Path(os.environ['CANDIDATE_DIR']).rglob('X-ray_Report_Studio_Windows_Setup.zip')) if os.environ.get('CANDIDATE_DIR') else None
          if candidate is None: candidate=next(temp.glob('xrs-candidate/**/*.zip'))
          downloads=pathlib.Path('official/x-ray-report-studio/downloads')
          shutil.copyfile(candidate,downloads/'X-ray_Report_Studio_Windows_Setup.zip')
          PY
          git -C official add -f -- x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip
          git -C official commit -m "release(xrs): activate Stable ${{ steps.baseline.outputs.new_version }}"
          git -C official push origin HEAD:refs/heads/codex/mri-report-studio
      - name: Verify public canonical ZIP before manifest activation
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          RELEASE_VERSION: ${{ steps.baseline.outputs.new_version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,time,urllib.request
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); expected=(temp/'xrs-candidate-sha256.txt').read_text().strip()
          url='https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip'
          ok=False
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url+'?canonical-check='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt),timeout=120) as r: actual=hashlib.sha256(r.read()).hexdigest()
                  if actual==expected: ok=True;break
              except Exception as e: print('Canonical ZIP propagation pending:',type(e).__name__)
              time.sleep(10)
          assert ok, 'Public canonical ZIP did not match the verified candidate; old manifest remains active'
          print('Canonical ZIP SHA-256 verified; old Stable manifest is still active.')
          PY
      - name: Activate latest.json as the final publication action
        env:
          RELEASE_VERSION: ${{ steps.baseline.outputs.new_version }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); version=os.environ['RELEASE_VERSION']
          sha=(temp/'xrs-candidate-sha256.txt').read_text().strip()
          p=pathlib.Path('official/x-ray-report-studio/downloads/latest.json')
          old=json.loads(p.read_text())
          assert old['version'] != version, 'Refusing to re-publish the current version'
          manifest={'version':version,'url':'https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip','sha256':sha}
          p.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY
          git -C official add -f -- x-ray-report-studio/downloads/latest.json
          git -C official commit -m "release(xrs): activate Stable ${{ steps.baseline.outputs.new_version }}"
          git -C official push origin HEAD:refs/heads/codex/mri-report-studio
      - name: Verify public Stable manifest and canonical ZIP
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          RELEASE_VERSION: ${{ steps.baseline.outputs.new_version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          version=os.environ['RELEASE_VERSION']; temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          expected=(temp/'xrs-candidate-sha256.txt').read_text().strip(); run_id=os.environ['GITHUB_RUN_ID']
          base='https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/'
          url='https://raw.githubusercontent.com/002-421/-main/codex/mri-report-studio/x-ray-report-studio/downloads/latest.json'
          verified=False
          # GitHub Raw advertises max-age=300 and may ignore query strings in its cache key.
          # Keep the verified prior version active while the bounded cache window expires.
          for attempt in range(42):
              try:
                  archive_hashes=[]
                  for name in ['X-ray_Report_Studio_Windows_Setup.zip',f'X-ray_Report_Studio_Windows_Setup-{version}.zip']:
                      with urllib.request.urlopen(base+name+'?release-check='+run_id+'-'+str(attempt),timeout=120) as r:data=r.read()
                      archive_hashes.append(hashlib.sha256(data).hexdigest())
                  with urllib.request.urlopen(url+'?release-check='+run_id+'-'+str(attempt),timeout=60) as r:manifest=json.load(r)
                  verified=(archive_hashes==[expected,expected] and manifest.get('version')==version and manifest.get('sha256')==expected and manifest.get('url')=='https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip')
                  if verified:break
                  print('Waiting for Raw CDN cache expiry; public manifest version:',manifest.get('version'),'canonical ZIP hash matches:',archive_hashes[0]==expected,flush=True)
              except Exception as e:print('Final public verification pending:',type(e).__name__,flush=True)
              time.sleep(10)
          assert verified,'Public Stable manifest and ZIP did not match after the bounded CDN cache window'
          print(f'RELEASED Stable {version}; candidate SHA-256 {expected}; previous ZIP and manifest backup retained.')
          PY
      - name: Restore previous Stable manifest after activation failure
        if: failure() && steps.official.conclusion == 'success'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          RELEASE_VERSION: ${{ steps.baseline.outputs.new_version }}
          OLD_VERSION: ${{ steps.baseline.outputs.old_version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          downloads=pathlib.Path('official/x-ray-report-studio/downloads'); previous=os.environ.get('OLD_VERSION','')
          backup=downloads/f'latest-{previous}-before-{os.environ["RELEASE_VERSION"]}.json'
          if not backup.is_file(): print('No verified rollback manifest was staged; rollback cannot be verified.'); raise SystemExit(1)
          value=json.loads(backup.read_text())
          old_zip=downloads/f'X-ray_Report_Studio_Windows_Setup-{previous}.zip'
          if not old_zip.is_file() or hashlib.sha256(old_zip.read_bytes()).hexdigest()!=value.get('sha256'):
              print('Verified previous-version ZIP is unavailable; refusing to write a rollback manifest.'); raise SystemExit(1)
          shutil.copyfile(old_zip,downloads/'X-ray_Report_Studio_Windows_Setup.zip')
          PY
          git -C official add -f -- x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip
          if git -C official diff --cached --quiet; then echo 'Previous Stable archive is already staged.'; else
            git -C official config user.name 'github-actions[bot]'
            git -C official config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C official commit -m "rollback(xrs): restore Stable ${{ steps.baseline.outputs.old_version }} ZIP"
            git -C official push origin HEAD:refs/heads/codex/mri-report-studio
          fi
          python3 - <<'PY'
          import hashlib,os,time,urllib.request
          previous=os.environ['OLD_VERSION']; expected=open(f'official/x-ray-report-studio/downloads/latest-{previous}-before-{os.environ["RELEASE_VERSION"]}.json').read()
          import json
          expected=json.loads(expected)['sha256']
          archive_url='https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip'
          restored=False
          for attempt in range(42):
              try:
                  with urllib.request.urlopen(archive_url+'?rollback-zip='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt),timeout=120) as r: restored=hashlib.sha256(r.read()).hexdigest()==expected
                  if restored: break
                  print('Previous ZIP propagation pending; SHA-256 mismatch',flush=True)
              except Exception as e: print('Previous ZIP rollback verification pending:',type(e).__name__,flush=True)
              time.sleep(10)
          assert restored, 'Previous Stable ZIP could not be restored publicly; latest.json was not rolled back'
          PY
          python3 - <<'PY'
          import json,os,pathlib
          downloads=pathlib.Path('official/x-ray-report-studio/downloads'); previous=os.environ.get('OLD_VERSION','')
          backup=downloads/f'latest-{previous}-before-{os.environ["RELEASE_VERSION"]}.json'
