name: XRS AI Offline Windows smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
        default: 3ad5a5685fe1e46522ccceb448c8ebe3221ae310

permissions:
  contents: read

jobs:
  default-branch-notice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain manual branch selection
        run: |
          echo "This file only enables workflow_dispatch from the default branch."
          echo "Select codex/xrs-ai-review-04b in the branch selector to run its pinned Windows smoke workflow."
          echo "No checkout, build, network request, release, or artifact upload is performed on main."
