name: XRS AI Offline Windows smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
        default: efabb9d5bbb842b4b05f8a8bfd88f075ea23f1c0

permissions:
  contents: read

jobs:
  windows-x64-smoke:
    if: github.ref == 'refs/heads/codex/xrs-ai-review-04b'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Validate the requested source revision
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'source_sha must be a full lowercase commit SHA' }

      - name: Checkout workflow tools from the selected workflow ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: ci-tools
          persist-credentials: false

      - name: Verify workflow ref and tools checkout
        shell: pwsh
        env:
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          $actual = (git -C ci-tools rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:WORKFLOW_SHA) { throw "Workflow tools SHA mismatch: expected $env:WORKFLOW_SHA, got $actual" }
          Write-Output "Workflow ref: $env:WORKFLOW_REF"
          Write-Output "Workflow/tools SHA: $actual"

      - name: Checkout exact application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Verify clean exact application checkout
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $app = 'source/x-ray-report-studio'
          $actual = (git -C source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:SOURCE_SHA) { throw "Expected $env:SOURCE_SHA, got $actual" }
          if ((git -C source status --porcelain).Length -ne 0) { throw 'Application source checkout is not clean' }
          if (-not (Test-Path "$app/package.json")) { throw 'XRS app directory is missing in the source checkout' }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci
        working-directory: source/x-ray-report-studio

      - name: Build renderer
        run: npm run build
        working-directory: source/x-ray-report-studio

      - name: Run the complete test suite
        run: npm test
        working-directory: source/x-ray-report-studio

      - name: Recheck clean application source tree
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ((git -C source rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) { throw 'Application source HEAD changed during checks' }
          if ((git -C source status --porcelain).Length -ne 0) { throw 'Build or tests modified the application source checkout' }

      - name: Package portable Electron runtime
        run: python scripts/package_windows.py
        working-directory: source/x-ray-report-studio

      - name: Verify ZIP and run isolated offline application smoke test
        shell: pwsh
        run: ./ci-tools/x-ray-report-studio/scripts/windows-ai-review-smoke.ps1 -SourcePath ../../source/x-ray-report-studio -Archive release/X-ray_Report_Studio_Windows_x64.zip

      - name: Upload test-only portable ZIP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xrs-ai-offline-windows-${{ inputs.source_sha }}
          path: source/x-ray-report-studio/release/X-ray_Report_Studio_Windows_x64.zip
          if-no-files-found: error
          retention-days: 3
