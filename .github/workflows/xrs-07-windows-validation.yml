name: XRS-07/XRS-08 Windows validation

on:
  push:
    branches: [codex/xrs-07-editor-template-stability, codex/xrs-08-stable-beta, codex/xrs-056-stable-clean, codex/xrs-first-start-confirmation, codex/xrs-updater-recovery, codex/xrs-updater-062, codex/xrs-updater-rollback-053, codex/xrs-updater-068, codex/xrs-ai-069, codex/xrs-functional-071, codex/xrs-ai-072, codex/xrs-ai-065, codex/xrs-ai-066, codex/xrs-ai-067, codex/xrs-template-073, codex/xrs-print-ai-074, codex/xrs-preview-calibration-075]
  pull_request:
    paths:
      - 'x-ray-report-studio/**'
      - '.github/workflows/xrs-07-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-editor:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: x-ray-report-studio
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose prior 0.4.66 unit failure from its actual log
        if: github.ref_name == 'codex/xrs-ai-066'
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import io, os, re, sys, urllib.request, zipfile
          sys.stdout.reconfigure(encoding='utf-8')
          url='https://api.github.com/repos/002-421/-main/actions/runs/43732938624/logs'
          try:
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=90) as response: archive=zipfile.ZipFile(io.BytesIO(response.read()))
              print('::warning title=Historical log files::'+str(archive.namelist()))
              for name in archive.namelist():
                  if 'Full unit suite' not in name: continue
                  lines=archive.read(name).decode('utf-8','replace').splitlines()
                  indices=[i for i,line in enumerate(lines) if re.search(r'not ok|✖|failing tests|AssertionError|ERR_ASSERTION',line)]
                  selected=sorted({j for i in indices for j in range(max(0,i-2),min(len(lines),i+45))})
                  detail='\n'.join(lines[j] for j in selected)[-25000:]
                  if detail:
                      escaped=detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::warning title=Historical unit failure::'+escaped)
          except Exception as error:
              print('::warning::Historical log retrieval unavailable: '+type(error).__name__)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: x-ray-report-studio/package-lock.json
      - name: Detect release channel from package version
        id: release-channel
        shell: pwsh
        working-directory: x-ray-report-studio
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $isBeta = $version -match '-beta\.'
          $sourceRef = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $isStable056 = $version -eq '0.4.56' -and $sourceRef -eq 'codex/xrs-056-stable-clean'
          $isUpdateHotfix = $sourceRef -eq 'codex/xrs-first-start-confirmation'
          $isUpdaterRecovery = $sourceRef -in @('codex/xrs-updater-recovery', 'codex/xrs-updater-062', 'codex/xrs-updater-068')
          $isUpdaterRollback053 = $sourceRef -in @('codex/xrs-updater-rollback-053', 'codex/xrs-updater-068', 'codex/xrs-ai-065', 'codex/xrs-ai-066', 'codex/xrs-ai-067', 'codex/xrs-ai-069', 'codex/xrs-functional-071', 'codex/xrs-ai-072')
          $isUpdaterCandidate060 = $version -eq '0.4.60' -and $isUpdaterRecovery
          $isTemplateCandidate073 = (($version -eq '0.4.73' -and $sourceRef -eq 'codex/xrs-template-073') -or ($version -eq '0.4.74' -and $sourceRef -eq 'codex/xrs-print-ai-074') -or ($version -eq '0.4.75' -and $sourceRef -eq 'codex/xrs-preview-calibration-075'))
          Add-Content -Path $env:GITHUB_OUTPUT -Value "beta=$($isBeta.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "stable056=$($isStable056.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "updateHotfix=$($isUpdateHotfix.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "updaterRecovery=$($isUpdaterRecovery.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "updaterRollback053=$($isUpdaterRollback053.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "updaterCandidate060=$($isUpdaterCandidate060.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "templateCandidate073=$($isTemplateCandidate073.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
      - run: npm ci
      - name: Install pinned Electron runtime
        if: steps.release-channel.outputs.stable056 != 'true'
        run: npm run desktop:install
      - name: Install Chromium for tab lifecycle scenario
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        run: npx playwright-core install chromium
      - run: npm run build
      - name: Verify Electron runtime for Windows shortcut test
        if: steps.release-channel.outputs.updateHotfix == 'true'
        shell: pwsh
        run: |
          $electronExe = Join-Path $env:GITHUB_WORKSPACE 'x-ray-report-studio/node_modules/electron/dist/electron.exe'
          if (-not (Test-Path -LiteralPath $electronExe -PathType Leaf)) { throw "Electron runtime executable is missing: $electronExe" }
      - name: First-start confirmation and Windows shortcut handoff tests
        id: first-start-tests
        if: steps.release-channel.outputs.updateHotfix == 'true'
        shell: pwsh
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP 'xrs-first-start-tests.txt'
          node --test tests/install-state.test.mjs tests/windows-integration.test.mjs 2>&1 | Tee-Object -FilePath $diagnostic
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## First-start updater test diagnostics' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text' -Encoding utf8
            Get-Content -LiteralPath $diagnostic | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            exit $testExit
          }
      - name: Package and verify Stable 0.4.56 updater candidate
        if: steps.release-channel.outputs.stable056 == 'true'
        shell: pwsh
        run: |
          python scripts/package_setup.py --candidate-output test-output/xrs-0.4.56 --candidate-version 0.4.56
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_setup_package.py --zip test-output/xrs-0.4.56/X-ray_Report_Studio_Windows_Setup.zip --source-electron electron --version 0.4.56
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = 'test-output/xrs-0.4.56/X-ray_Report_Studio_Windows_Setup.zip'
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path 'test-output/xrs-0.4.56/SHA256SUMS.txt' -Value "$hash  X-ray_Report_Studio_Windows_Setup.zip" -NoNewline
          Write-Host "Stable setup ZIP SHA-256: $hash"
      - name: Real Windows backup lock transport and release updater acceptance
        id: backup-lock-tests
        if: github.ref_name == 'codex/xrs-print-ai-074'
        run: node tests/windows-backup-lock-checks.mjs
      - name: Preserve Windows backup lock diagnosis and repetition results
        if: always() && steps.backup-lock-tests.outcome != 'skipped' && github.ref_name == 'codex/xrs-print-ai-074'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-0.4.74-backup-lock-diagnostics
          path: x-ray-report-studio/test-output/windows-backup-lock/
          if-no-files-found: error
      - name: Full unit suite
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        shell: pwsh
        run: |
          # Keep dictionary-heavy files from starving the real PowerShell lock fixture.
          $result = & node --test --test-concurrency=1 tests/*.test.mjs 2>&1
          $testExit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host $_ }
          if ($testExit -ne 0) {
            $tail = ($result | Select-Object -Last 40 | Out-String)
            if ($tail.Length -gt 6000) { $tail = $tail.Substring($tail.Length - 6000) }
            $diagnostic = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Unit failure::$diagnostic"
            exit $testExit
          }
      - name: Targeted Stable updater tests
        if: steps.release-channel.outputs.stable056 == 'true'
        run: node --test tests/update-channel.test.mjs tests/update-version.test.mjs tests/update-install.test.mjs tests/update-settings.test.mjs
      - name: Updater recovery and Windows process tests
        id: updater-recovery-tests
        if: steps.release-channel.outputs.updaterRecovery == 'true'
        shell: pwsh
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP 'xrs-updater-recovery-windows-tests.txt'
          node --test tests/user-data-backup.test.mjs tests/update-install.test.mjs tests/install-state.test.mjs tests/log-safety.test.mjs tests/update-settings.test.mjs tests/update-confirmation.test.mjs tests/windows-integration.test.mjs 2>&1 | Tee-Object -FilePath $diagnostic
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Updater recovery Windows test diagnostics' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text' -Encoding utf8
            Get-Content -LiteralPath $diagnostic | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            exit $testExit
          }
      - name: Upload updater recovery Windows diagnostics
        if: always() && steps.updater-recovery-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-updater-recovery-windows-diagnostics-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/xrs-updater-recovery-windows-tests.txt
      - name: Build and verify unpublished Windows 0.4.60 candidate
        if: steps.release-channel.outputs.updaterCandidate060 == 'true'
        shell: pwsh
        run: |
          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_setup.py --candidate-output test-output/xrs-0.4.60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_setup_package.py --zip test-output/xrs-0.4.60/X-ray_Report_Studio_Windows_Setup.zip --source-electron electron --version 0.4.60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = 'release/X-ray_Report_Studio_Windows_x64.zip'
          $setup = 'test-output/xrs-0.4.60/X-ray_Report_Studio_Windows_Setup.zip'
          $portableCheck = @'
          import json, zipfile
          archive = zipfile.ZipFile(r'release/X-ray_Report_Studio_Windows_x64.zip')
          assert archive.testzip() is None, 'portable ZIP integrity check failed'
          names = set(archive.namelist())
          root = 'X-ray Report Studio/'
          required = [root + 'X-ray Report Studio.exe', root + 'resources/app/dist/index.html', root + 'resources/app/package.json', root + 'resources/app/electron/main.cjs', root + 'resources.pak', root + 'icudtl.dat']
          missing = [name for name in required if name not in names]
          assert not missing, 'portable ZIP is missing required runtime files: ' + ', '.join(missing)
          package = json.loads(archive.read(root + 'resources/app/package.json'))
          assert package.get('version') == '0.4.60', 'portable app version mismatch'
          print('PORTABLE VERIFIED: version 0.4.60, Electron runtime and app payload present')
          '@
          python -c $portableCheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          Set-Content -Path 'test-output/xrs-0.4.60/SHA256SUMS.txt' -Value "$portableHash  X-ray_Report_Studio_Windows_x64.zip`n$setupHash  X-ray_Report_Studio_Windows_Setup.zip"
          Write-Host "Portable ZIP SHA256: $portableHash"
          Write-Host "Setup ZIP SHA256: $setupHash"
          git diff --exit-code -- downloads/latest.json
      - name: Upload unpublished Windows 0.4.60 candidate
        if: steps.release-channel.outputs.updaterCandidate060 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-0.4.60-windows-candidate
          if-no-files-found: error
          path: |
            x-ray-report-studio/release/X-ray_Report_Studio_Windows_x64.zip
            x-ray-report-studio/test-output/xrs-0.4.60/X-ray_Report_Studio_Windows_Setup.zip
            x-ray-report-studio/test-output/xrs-0.4.60/SHA256SUMS.txt
      - name: Workspace recovery and tab isolation
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        shell: pwsh
        run: |
          npm run test:tab-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workspace-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: DOCX, PDF and Electron editor integration
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        run: npm run test:browser
      - name: Offline AI contextual review acceptance
        if: github.ref_name == 'codex/xrs-preview-calibration-075' || github.ref_name == 'codex/xrs-print-ai-074' || github.ref_name == 'codex/xrs-ai-072' || github.ref_name == 'codex/xrs-ai-065' || github.ref_name == 'codex/xrs-ai-066' || github.ref_name == 'codex/xrs-ai-067' || github.ref_name == 'codex/xrs-ai-069' || github.ref_name == 'codex/xrs-template-073'
        shell: pwsh
        run: |
          $scenarios = @('ai-review-browser', 'morphology-browser', 'dictionary-electron', 'final-medical-browser', 'final-renderer-electron', 'update-progress-browser')
          if ($env:GITHUB_REF_NAME -in @('codex/xrs-ai-067', 'codex/xrs-ai-069')) { $scenarios += 'ai-067-electron' }
          foreach ($scenario in $scenarios) {
            Write-Host "Running $scenario"
            $result = & node "tests/$scenario.mjs" 2>&1
            $scenarioExit = $LASTEXITCODE
            $result | ForEach-Object { Write-Host $_ }
            if ($scenarioExit -ne 0) {
              $diagnostic = ($result | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=${scenario}::$diagnostic"
              exit $scenarioExit
            }
          }
      - name: Per-document Undo and Redo history across tabs and restart
        id: report-history-tests
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        shell: pwsh
        run: |
          npm run test:history-browser
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $file = 'test-output/report-history-failure.json'
            if (Test-Path -LiteralPath $file) {
              $detail = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
              $message = "stage=$($detail.stage); error=$($detail.errorMessage)"
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Report history failure::$message"
            }
            exit $testExit
          }
      - name: Preserve report history failure diagnostics
        if: failure() && steps.report-history-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-report-history-diagnostics-${{ github.run_id }}
          path: |
            x-ray-report-studio/test-output/report-history-failure.json
            x-ray-report-studio/test-output/report-history-failure.png
          if-no-files-found: warn
      - name: Word-oriented preview pagination with synthetic reports
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        run: node tests/preview-pagination-browser.mjs
      - name: Doctor formatting and adaptive print acceptance
        id: doctor-print-tests
        if: github.ref_name == 'codex/xrs-print-ai-074' || github.ref_name == 'codex/xrs-preview-calibration-075'
        run: node tests/doctor-print-browser.mjs
      - name: Preserve adaptive print failure diagnostics
        if: failure() && steps.doctor-print-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-doctor-print-diagnostics-${{ github.run_id }}
          path: x-ray-report-studio/test-output/doctor-print-failure.*
          if-no-files-found: warn
      - name: Individual Word preview calibration and unchanged exports
        id: preview-calibration-tests
        if: github.ref_name == 'codex/xrs-preview-calibration-075'
        run: node tests/preview-calibration-browser.mjs
      - name: Preserve calibration failure diagnostics
        if: failure() && steps.preview-calibration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-preview-calibration-diagnostics-${{ github.run_id }}
          path: x-ray-report-studio/test-output/calibration-failure.*
          if-no-files-found: warn
      - name: Export and preserve patient tab lifecycle (1, 2, 5, 12 tabs)
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        run: npm run test:tab-lifecycle
      - name: Functional 0.4.71 browser acceptance
        if: github.ref_name == 'codex/xrs-functional-071'
        run: node tests/functional-071-browser.mjs
      - name: Verified profile backup tests
        if: steps.release-channel.outputs.stable056 != 'true' && steps.release-channel.outputs.updateHotfix != 'true' && steps.release-channel.outputs.updaterRecovery != 'true'
        run: npm run test:preupdate-backup
      - name: Upload synthetic first-start test diagnostics
        if: always() && steps.first-start-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-first-start-windows-diagnostics-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/xrs-first-start-tests.txt
      - name: Parse Beta PowerShell scripts with Windows PowerShell 5.1
        if: steps.release-channel.outputs.beta == 'true'
        shell: powershell
        run: |
          $files = @('tests/Start-XRS-Beta.Tests.ps1', 'scripts/Start-XRS-Beta.ps1', 'scripts/XRS-PreUpdate-Backup.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }; exit 1 }
          }
          Write-Host 'PASS: Beta PowerShell scripts parse in Windows PowerShell.'
      - name: Beta onboarding with synthetic Windows profiles
        if: steps.release-channel.outputs.beta == 'true'
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/Start-XRS-Beta.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package unpublished Windows Beta candidates
        if: steps.release-channel.outputs.beta == 'true'
        shell: pwsh
        run: |
          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_beta_setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_beta_artifact.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- downloads/latest.json
      - name: Packaged Beta EXE startup on Windows
        if: steps.release-channel.outputs.beta == 'true'
        run: node tests/beta-portable-smoke.mjs
      - name: Upload Stable 0.4.56 updater candidate
        if: steps.release-channel.outputs.stable056 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-0.4.56-windows-setup-candidate
          if-no-files-found: error
          path: |
            x-ray-report-studio/test-output/xrs-0.4.56/X-ray_Report_Studio_Windows_Setup.zip
            x-ray-report-studio/test-output/xrs-0.4.56/SHA256SUMS.txt
      - name: Package and verify unpublished ${{ steps.release-channel.outputs.version }} updater candidate
        if: steps.release-channel.outputs.updaterRollback053 == 'true' || steps.release-channel.outputs.templateCandidate073 == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release-channel.outputs.version }}'
          $output = "test-output/xrs-$version"
          python scripts/package_setup.py --candidate-output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $output 'X-ray_Report_Studio_Windows_Setup.zip'
          python scripts/verify_setup_package.py --zip $archive --source-electron electron --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $output 'SHA256SUMS.txt') -Value "$hash  X-ray_Report_Studio_Windows_Setup.zip" -NoNewline
          Write-Host "Unpublished updater candidate $version Setup ZIP SHA256: $hash"
          "Setup ZIP $version SHA256: $hash" | Add-Content $env:GITHUB_STEP_SUMMARY
          git diff --exit-code -- downloads/latest.json
      - name: Real packaged updater regression and clipboard on Windows
        if: github.ref_name == 'codex/xrs-ai-069'
        shell: pwsh
        run: |
          node tests/updater-069-electron.mjs 2>&1 | Tee-Object -Variable detail
          if ($LASTEXITCODE -ne 0) {
            $diagnostic = ($detail | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Packaged updater regression::$diagnostic"
            exit 1
          }
      - name: Parse packaged Install.ps1 with Windows PowerShell 5.1
        if: steps.release-channel.outputs.updaterRollback053 == 'true' || steps.release-channel.outputs.templateCandidate073 == 'true'
        shell: powershell
        run: |
          $version = '${{ steps.release-channel.outputs.version }}'
          $archive = Join-Path $PWD "test-output/xrs-$version/X-ray_Report_Studio_Windows_Setup.zip"
          $stage = Join-Path $env:RUNNER_TEMP ('XRS-Setup-Parser-' + $env:GITHUB_RUN_ID)
          try {
            Expand-Archive -LiteralPath $archive -DestinationPath $stage -Force
            $installer = Join-Path $stage 'X-ray Report Studio Setup/Install.ps1'
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($installer, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host 'PASS: packaged Install.ps1 parses in Windows PowerShell 5.1.'
          } finally {
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload unpublished ${{ steps.release-channel.outputs.version }} updater candidate
        if: steps.release-channel.outputs.updaterRollback053 == 'true' || steps.release-channel.outputs.templateCandidate073 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xrs-${{ steps.release-channel.outputs.version }}-windows-candidate
          if-no-files-found: error
          path: |
