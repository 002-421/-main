name: XRS-01 Electron browser tests

on:
  push:
    branches: [codex/xrs-06-release-0.4.54]
  pull_request:
    branches: [codex/mri-report-studio, codex/xrs-05-integration-validation]
    paths:
      - 'x-ray-report-studio/**'
      - '.github/workflows/xrs-01-electron.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: x-ray-report-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: x-ray-report-studio/package-lock.json
      - name: Install dependencies and checksum-verified Electron
        run: |
          npm ci
          npm run desktop:install
      - name: TypeScript check and production build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Synthetic Undo history memory and storage benchmark
        run: npm run test:history-benchmark
      - name: Install Chromium for workspace recovery tests
        run: npx playwright-core install --with-deps chromium
      - name: Document tab isolation regression
        run: npm run test:tab-isolation
      - name: Workspace recovery browser tests
        run: npm run test:workspace-recovery
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Electron integration tests
        run: |
          set -o pipefail
          mkdir -p test-output
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npm run test:browser 2>&1 | tee test-output/electron-integration.log
      - name: Electron Undo/Redo scroll regression
        run: |
          set -o pipefail
          mkdir -p test-output
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npm run test:undo-scroll 2>&1 | tee test-output/undo-scroll.log
      - name: Electron Undo/Redo persistence and tab history regression
        run: |
          set -o pipefail
          mkdir -p test-output
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' npm run test:history-browser 2>&1 | tee test-output/history-browser.log
      - name: Upload Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xrs-01-electron-failure-diagnostics
          path: |
            x-ray-report-studio/test-output/electron-*
            x-ray-report-studio/test-output/undo-scroll.log
            x-ray-report-studio/test-output/history-browser.log
          if-no-files-found: warn
          retention-days: 7
