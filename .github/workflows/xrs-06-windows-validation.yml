name: XRS-06 Windows 0.4.54 release candidate validation

on:
  push:
    branches: [codex/xrs-06-release-0.4.54]
  pull_request:
    branches: [codex/xrs-05-integration-validation]
    paths:
      - 'x-ray-report-studio/**'
      - '.github/workflows/xrs-06-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: x-ray-report-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: x-ray-report-studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Install checksum-verified Windows Electron runtime
        run: npm run desktop:install
      - name: Verify candidate version and build
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne '0.4.54') { throw "Expected release candidate 0.4.54, found $version" }
          npm run build
      - name: Unit tests
        run: npm test
      - name: Synthetic Undo history memory and storage benchmark
        run: npm run test:history-benchmark
      - name: Validate installer PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install_windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Windows install, shortcut, backup and rollback tests
        run: npm run test:windows-integration
      - name: Install Chromium for browser regressions
        run: npx playwright-core install chromium
      - name: Tab isolation and workspace recovery
        shell: pwsh
        run: |
          npm run test:tab-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workspace-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Electron DOCX/PDF, template and editor integration
        run: npm run test:browser
      - name: Electron Undo/Redo caret and scroll regression
        run: npm run test:undo-scroll
      - name: Electron persistent history, depth and recovery regression
        run: npm run test:history-browser
      - name: Build isolated Windows 0.4.54 test kit
        run: npm run package:windows-test-kit
      - name: Upload isolated release candidate test kit
        uses: actions/upload-artifact@v4
        with:
          name: XRS-06-Windows-0.4.54-Test-Kit
          path: x-ray-report-studio/test-output/XRS-06-Windows-0.4.54-Test-Kit.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized Windows Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XRS-06-Windows-Electron-Failure-Diagnostics
          path: |
            x-ray-report-studio/test-output/report-history-failure.png
            x-ray-report-studio/test-output/report-history-failure.json
            x-ray-report-studio/test-output/undo-scroll-failure.png
            x-ray-report-studio/test-output/undo-scroll-failure.json
          if-no-files-found: warn
          retention-days: 7
