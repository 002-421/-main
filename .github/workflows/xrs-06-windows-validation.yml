name: XRS-06 Windows 0.4.54 release candidate validation

on:
  push:
    branches: [codex/xrs-06-release-0.4.54]
  pull_request:
    branches: [codex/xrs-05-integration-validation]
    paths:
      - 'x-ray-report-studio/**'
      - '.github/workflows/xrs-06-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: x-ray-report-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: x-ray-report-studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Install checksum-verified Windows Electron runtime
        run: npm run desktop:install
      - name: Verify candidate version and build
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne '0.4.54') { throw "Expected release candidate 0.4.54, found $version" }
          npm run build
      - name: Unit tests
        run: npm test
      - name: Build and verify Windows Setup ZIP candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'test-output' | Out-Null
          $diagnostic = [ordered]@{ phase = 'start'; unittestExit = $null; packageExit = $null; packageOutputTail = @(); verifyExit = $null; expectedSha256 = $null; actualSha256 = $null; bytes = $null; packageDiff = @(); error = $null }
          function Save-CandidateDiagnostic([string]$errorMessage, [int]$exitCode) {
            $diagnostic.error = $errorMessage
            $diagnostic | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'test-output/setup-package-ci-diagnostics.json' -Encoding utf8
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Setup package diagnostic: ' + ($diagnostic | ConvertTo-Json -Compress -Depth 4))
            Write-Output ('::error title=Setup ZIP candidate::' + $errorMessage)
            exit $exitCode
          }
          python -m unittest discover -s tests -p test_setup_package.py
          $diagnostic.unittestExit = $LASTEXITCODE
          if ($LASTEXITCODE -ne 0) { Save-CandidateDiagnostic 'Setup package verifier unit tests failed.' $LASTEXITCODE }
          $packageOutput = & npm run package:setup 2>&1
          $diagnostic.packageExit = $LASTEXITCODE
          $diagnostic.packageOutputTail = @($packageOutput | ForEach-Object { [string]$_ } | Select-Object -Last 12)
          if ($LASTEXITCODE -ne 0) { Save-CandidateDiagnostic ('package:setup failed on Windows: ' + ($diagnostic.packageOutputTail -join ' | ')) $LASTEXITCODE }
          $candidateUrl = 'https://github.com/002-421/-main/raw/refs/heads/codex/xrs-06-release-0.4.54/x-ray-report-studio/downloads/xrs-06-candidate-0.4.54/downloads/X-ray_Report_Studio_Windows_Setup.zip'
          python scripts/verify_setup_package.py --zip downloads/X-ray_Report_Studio_Windows_Setup.zip --source-electron electron --version 0.4.54 --candidate-url $candidateUrl --manifest-out test-output/latest-0.4.54-candidate.json
          $diagnostic.verifyExit = $LASTEXITCODE
          if (Test-Path -LiteralPath 'downloads/X-ray_Report_Studio_Windows_Setup.zip') {
            $diagnostic.actualSha256 = (Get-FileHash 'downloads/X-ray_Report_Studio_Windows_Setup.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
            $diagnostic.bytes = (Get-Item 'downloads/X-ray_Report_Studio_Windows_Setup.zip').Length
          }
          if ($LASTEXITCODE -ne 0) { Save-CandidateDiagnostic 'Windows Setup ZIP structural or dependency validation failed.' $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'test-output/latest-0.4.54-candidate.json')) { Save-CandidateDiagnostic 'Verifier did not produce the candidate manifest.' 1 }
          $checkedInCandidate = Get-Content 'downloads/latest-0.4.54-candidate.json' -Raw | ConvertFrom-Json
          $builtCandidate = Get-Content 'test-output/latest-0.4.54-candidate.json' -Raw | ConvertFrom-Json
          $diagnostic.expectedSha256 = [string]$checkedInCandidate.sha256
          $diagnostic.phase = 'manifest-comparison'
          $diagnostic | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'test-output/setup-package-ci-diagnostics.json' -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Setup package diagnostic: ' + ($diagnostic | ConvertTo-Json -Compress -Depth 4))
          if ($checkedInCandidate.version -ne $builtCandidate.version -or $checkedInCandidate.url -ne $builtCandidate.url -or $checkedInCandidate.sha256 -ne $builtCandidate.sha256) {
            $diffOutput = & python scripts/verify_setup_package.py --zip downloads/X-ray_Report_Studio_Windows_Setup.zip --source-electron electron --version 0.4.54 --reference-zip downloads/xrs-06-candidate-0.4.54/downloads/X-ray_Report_Studio_Windows_Setup.zip 2>&1
            $diagnostic.packageDiff = @($diffOutput | ForEach-Object { [string]$_ } | Select-Object -Last 2)
            $message = 'Candidate mismatch: expected SHA ' + $diagnostic.expectedSha256 + ', actual SHA ' + $diagnostic.actualSha256 + '; ' + ($diagnostic.packageDiff -join ' | ')
            Save-CandidateDiagnostic $message 1
          }
      - name: Upload Windows 0.4.54 Setup ZIP and inactive candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: XRS-06-Windows-0.4.54-Setup-Candidate
          path: |
            x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip
            x-ray-report-studio/test-output/latest-0.4.54-candidate.json
          if-no-files-found: error
          retention-days: 14
      - name: Synthetic Undo history memory and storage benchmark
        run: npm run test:history-benchmark
      - name: Validate installer PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install_windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Validate and test pre-update backup utility with synthetic data
        shell: powershell
        run: |
          foreach ($file in @('scripts/XRS-PreUpdate-Backup.ps1', 'tests/XRS-PreUpdate-Backup.Tests.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }; exit 1 }
          }
          npm run test:preupdate-backup-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify backup command-line success message
        run: npm run test:preupdate-backup-cli-success
        shell: powershell
      - name: Verify backup command-line failure exit code
        run: npm run test:preupdate-backup-cli-failure-exit
        shell: powershell
      - name: Verify backup command-line failure message
        run: npm run test:preupdate-backup-cli-failure-output
        shell: powershell
      - name: Verify failed backup leaves no partial directory
        run: npm run test:preupdate-backup-cli-cleanup
        shell: powershell
      - name: Windows install, shortcut, backup and rollback tests
        run: npm run test:windows-integration
      - name: Install Chromium for browser regressions
        run: npx playwright-core install chromium
      - name: Tab isolation and workspace recovery
        shell: pwsh
        run: |
          npm run test:tab-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workspace-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Electron DOCX/PDF, template and editor integration
        run: npm run test:browser
      - name: Electron Undo/Redo caret and scroll regression
        run: npm run test:undo-scroll
      - name: Add sanitized Undo/Redo diagnostics to run summary
        if: always()
        shell: pwsh
        run: |
          $diagnosticPath = 'test-output/undo-scroll-failure.json'
          if (-not (Test-Path -LiteralPath $diagnosticPath)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Undo/Redo diagnostic JSON was not produced.'
            exit 0
          }
          $diagnostic = Get-Content -LiteralPath $diagnosticPath -Raw | ConvertFrom-Json
          $snapshot = $diagnostic.snapshot
          $safe = @(
            '### Sanitized Electron Undo/Redo diagnostics',
            ('Error type: ' + [string]$diagnostic.errorName),
            ('Test line: ' + [string]$diagnostic.failureLine),
            ('Assertion: ' + [string]$diagnostic.safeFailureMessage),
            ('Scroll top / height / viewport: ' + [string]$snapshot.scrollTop + ' / ' + [string]$snapshot.scrollHeight + ' / ' + [string]$snapshot.clientHeight),
            ('Caret bounds: ' + ($snapshot.caret | ConvertTo-Json -Compress)),
            ('Editor viewport bounds: ' + ($snapshot.viewport | ConvertTo-Json -Compress)),
            ('Active tab index / reports / paragraphs: ' + [string]$snapshot.activeTabIndex + ' / ' + [string]$snapshot.reportCount + ' / ' + [string]$snapshot.paragraphCount),
            ('Renderer error names: ' + (($snapshot.rendererErrors | ForEach-Object { [string]$_ }) -join ', '))
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($safe -join "`n")
      - name: Electron persistent history, depth and recovery regression
        run: npm run test:history-browser
      - name: Build isolated Windows 0.4.54 test kit
        run: npm run package:windows-test-kit
      - name: Upload isolated release candidate test kit
        uses: actions/upload-artifact@v4
        with:
          name: XRS-06-Windows-0.4.54-Test-Kit
          path: x-ray-report-studio/test-output/XRS-06-Windows-0.4.54-Test-Kit.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized Windows Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XRS-06-Windows-Electron-Failure-Diagnostics
          path: |
            x-ray-report-studio/test-output/XRS-PreUpdate-Backup-Failure.txt
            x-ray-report-studio/test-output/report-history-failure.png
            x-ray-report-studio/test-output/report-history-failure.json
            x-ray-report-studio/test-output/browser-edit-failure.json
            x-ray-report-studio/test-output/undo-scroll-failure.png
            x-ray-report-studio/test-output/undo-scroll-failure.json
            x-ray-report-studio/test-output/setup-package-ci-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
