name: XRS Stable 0.4.55 release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xrs-stable-0.4.55-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the official Stable update branch
        uses: actions/checkout@v4
        with:
          ref: codex/mri-report-studio
          path: release

      - name: Verify the prepared Windows run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = '002-421/-main'
          run_id = '43528607562'
          expected_sha = 'a7e6d44167bc986d74cefff03e45588788758469'
          expected_workflow_id = 417418731
          expected_workflow_path = '.github/workflows/xrs-09-release-0.4.55.yml'
          expected_event = 'push'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'xrs-0.4.55-release',
          }
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = get('/actions/runs/' + run_id)
          assert run.get('head_sha') == expected_sha, 'Windows candidate source SHA mismatch.'
          assert run.get('head_branch') == 'codex/xrs-09-local-upgrade', 'Windows candidate source branch mismatch.'
          assert run.get('status') == 'completed' and run.get('conclusion') in ('success', 'failure'), 'Windows candidate run is incomplete or cancelled.'
          assert run.get('workflow_id') == expected_workflow_id, 'Unexpected workflow ID produced the candidate.'
          assert run.get('path') == expected_workflow_path, 'Unexpected workflow path produced the candidate.'
          assert run.get('event') == expected_event, 'Unexpected event produced the candidate.'
          jobs = get('/actions/runs/' + run_id + '/jobs?per_page=100').get('jobs', [])
          steps = [step for job in jobs for step in job.get('steps', [])]
          failures = [step['name'] for step in steps if step.get('conclusion') == 'failure']
          assert not failures or failures == ['Windows Electron browser integration'], 'Candidate run has failure beyond the known browser suite: ' + ', '.join(failures)
          required = (
              'Run npm run build',
              'Run npm test',
              'Verify release candidate is Stable 0.4.55 and channel manifest remains untouched',
              'Download and verify the official 0.4.54 Setup ZIP',
              'Prepare and validate inactive latest.json candidate',
          )
          for name in required:
              matching = [step for step in steps if step.get('name') == name]
              assert matching and matching[0].get('conclusion') == 'success', 'Required candidate step did not pass: ' + name
          artifacts = get('/actions/runs/' + run_id + '/artifacts?per_page=100').get('artifacts', [])
          matches = [item for item in artifacts if item.get('name') == 'xrs-09-stable-0.4.55-release-candidate' and not item.get('expired')]
          assert len(matches) == 1, 'Prepared Windows release artifact is missing or ambiguous.'
          print('Windows run, source SHA, required packaging checks, and candidate artifact verified.')
          PY

      - name: Download the exact prepared Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: xrs-09-stable-0.4.55-release-candidate
          run-id: 43528607562
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/xrs-055-candidate

      - name: Verify candidate ZIP, version, metadata, and SHA-256
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-055-candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['CANDIDATE_DIR'])
          archive = root / 'X-ray_Report_Studio_Windows_Setup.zip'
          assert archive.is_file() and archive.stat().st_size > 0, 'Windows Setup ZIP is missing or empty.'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = json.loads((root / 'latest.json').read_text(encoding='utf-8-sig'))
          report = (root / 'PREPARATION.txt').read_text(encoding='utf-8-sig')
          checksum = (root / 'SHA256.txt').read_text(encoding='ascii')
          assert manifest.get('version') == '0.4.55' and manifest.get('sha256') == digest, 'Candidate manifest does not match the installer ZIP.'
          assert digest in checksum.lower(), 'Candidate SHA256.txt does not match the installer ZIP.'
          assert 'Source SHA: a7e6d44167bc986d74cefff03e45588788758469' in report, 'Candidate report has a different source SHA.'
          assert 'preparation: PASS' in report, 'Candidate preparation did not pass.'
          with zipfile.ZipFile(archive) as package:
              corrupt = package.testzip()
              assert corrupt is None, 'Corrupt ZIP entry: ' + str(corrupt)
              names = set(package.namelist())
              prefix = 'X-ray Report Studio Setup/'
              package_json = json.loads(package.read(prefix + 'app/package.json').decode('utf-8'))
              assert package_json.get('version') == '0.4.55', 'Installer does not contain version 0.4.55.'
              assert package_json.get('main') == 'electron/main.cjs', 'Installer Electron entry point is missing.'
              assert prefix + 'app/electron/main.cjs' in names, 'Electron main process is missing.'
              assert prefix + 'app/electron/preload.cjs' in names, 'Electron preload is missing.'
              assert prefix + 'app/dist/index.html' in names, 'Application renderer is missing.'
          print(f'Candidate verified: 0.4.55, {archive.stat().st_size} bytes, SHA256 {digest}')
          PY

      - name: Verify Stable 0.4.54 and stage versioned and canonical ZIPs
        working-directory: release
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-055-candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          downloads = pathlib.Path('x-ray-report-studio/downloads')
          current = json.loads((downloads / 'latest.json').read_text(encoding='utf-8'))
          old_sha = '04ae2cd7745edb92e2c115ca8a620deb0f86152b281a4747eef656f91a768cc3'
          expected_url = 'https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip'
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert current.get('version') == '0.4.54' and current.get('sha256') == old_sha and current.get('url') == expected_url, 'Stable baseline changed; refusing publication.'
          old_archive = downloads / 'X-ray_Report_Studio_Windows_Setup-0.4.54.zip'
          canonical = downloads / 'X-ray_Report_Studio_Windows_Setup.zip'
          assert sha(old_archive) == old_sha, 'Versioned 0.4.54 rollback ZIP is missing or invalid.'
          candidate = pathlib.Path(os.environ['CANDIDATE_DIR']) / 'X-ray_Report_Studio_Windows_Setup.zip'
          new_sha = sha(candidate)
          assert sha(canonical) in (old_sha, new_sha), 'Canonical installer has unexpected content.'
          backup = downloads / 'latest-0.4.54-before-0.4.55.json'
          if backup.exists():
              assert json.loads(backup.read_text(encoding='utf-8')) == current, 'Existing 0.4.54 manifest backup differs.'
          else:
              backup.write_bytes((downloads / 'latest.json').read_bytes())
          versioned = downloads / 'X-ray_Report_Studio_Windows_Setup-0.4.55.zip'
          if versioned.exists():
              assert sha(versioned) == new_sha, 'Refusing to overwrite a different 0.4.55 archive.'
          else:
              shutil.copyfile(candidate, versioned)
          shutil.copyfile(candidate, canonical)
          print(f'0.4.54 rollback archive verified. Staged versioned and canonical ZIPs with SHA256 {new_sha}.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup-0.4.55.zip x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip x-ray-report-studio/downloads/latest-0.4.54-before-0.4.55.json
          if ! git diff --cached --quiet; then
            git commit -m 'release(xrs): stage verified 0.4.55 ZIP and preserve 0.4.54'
            git push origin HEAD:refs/heads/codex/mri-report-studio
          fi

      - name: Verify both public ZIP URLs before switching the manifest
        working-directory: release
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-055-candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request
          root = pathlib.Path('x-ray-report-studio/downloads')
          manifest_url = 'https://raw.githubusercontent.com/002-421/-main/codex/mri-report-studio/x-ray-report-studio/downloads/latest.json'
          base = 'https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/'
          candidate = pathlib.Path(os.environ['CANDIDATE_DIR']) / 'X-ray_Report_Studio_Windows_Setup.zip'
          expected = hashlib.sha256(candidate.read_bytes()).hexdigest()
          for filename in ('X-ray_Report_Studio_Windows_Setup-0.4.55.zip', 'X-ray_Report_Studio_Windows_Setup.zip'):
              verified = False
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(base + filename + '?verify=' + str(attempt), headers={'User-Agent':'xrs-0.4.55-release'})
                      with urllib.request.urlopen(request, timeout=120) as response: payload = response.read()
                      if hashlib.sha256(payload).hexdigest() == expected:
                          verified = True
                          break
                  except Exception as error:
                      print('ZIP propagation pending:', filename, type(error).__name__, flush=True)
                  time.sleep(10)
              assert verified, 'Public ZIP failed SHA256 verification: ' + filename
          request = urllib.request.Request(manifest_url + '?baseline=' + str(time.time_ns()), headers={'User-Agent':'xrs-0.4.55-release'})
          with urllib.request.urlopen(request, timeout=60) as response: live = json.load(response)
          assert live.get('version') == '0.4.54' and live.get('sha256') == '04ae2cd7745edb92e2c115ca8a620deb0f86152b281a4747eef656f91a768cc3', 'Stable manifest changed concurrently; leaving 0.4.54 active.'
          print('Both public 0.4.55 ZIP URLs match the candidate SHA256; 0.4.54 manifest remains active.')
          PY

      - name: Activate 0.4.55 latest.json last
        working-directory: release
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-055-candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          downloads = pathlib.Path('x-ray-report-studio/downloads')
          path = downloads / 'latest.json'
          current = json.loads(path.read_text(encoding='utf-8'))
          old_sha = '04ae2cd7745edb92e2c115ca8a620deb0f86152b281a4747eef656f91a768cc3'
          assert current.get('version') == '0.4.54' and current.get('sha256') == old_sha, 'Stable manifest changed; refusing to activate 0.4.55.'
          archive = downloads / 'X-ray_Report_Studio_Windows_Setup.zip'
          candidate = pathlib.Path(os.environ['CANDIDATE_DIR']) / 'X-ray_Report_Studio_Windows_Setup.zip'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          new_sha = sha(candidate)
          assert sha(archive) == new_sha, 'Canonical ZIP changed after public verification.'
          manifest = {
              'version': '0.4.55',
              'url': 'https://github.com/002-421/-main/raw/refs/heads/codex/mri-report-studio/x-ray-report-studio/downloads/X-ray_Report_Studio_Windows_Setup.zip',
              'sha256': new_sha,
          }
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          git add -- x-ray-report-studio/downloads/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release(xrs): activate verified 0.4.55 update'
          git push origin HEAD:refs/heads/codex/mri-report-studio

      - name: Verify public 0.4.55 manifest and canonical ZIP
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/xrs-055-candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request
          expected = hashlib.sha256((pathlib.Path(os.environ['CANDIDATE_DIR'])/'X-ray_Report_Studio_Windows_Setup.zip').read_bytes()).hexdigest()
          manifest_url = 'https://raw.githubusercontent.com/002-421/-main/codex/mri-report-studio/x-ray-report-studio/downloads/latest.json'
          ok = False
          for attempt in range(12):
              try:
                  request = urllib.request.Request(manifest_url + '?verify=' + str(attempt), headers={'User-Agent':'xrs-0.4.55-release'})
                  with urllib.request.urlopen(request, timeout=60) as response: manifest = json.load(response)
                  if manifest.get('version') == '0.4.55' and manifest.get('sha256') == expected and manifest.get('url', '').endswith('/downloads/X-ray_Report_Studio_Windows_Setup.zip'):
                      ok = True
                      break
              except Exception as error:
                  print('Manifest propagation pending:', type(error).__name__, flush=True)
              time.sleep(10)
          assert ok, 'Public latest.json does not reference the verified 0.4.55 ZIP.'
          print('RELEASED 0.4.55; public manifest and ZIP SHA256 agree. Versioned 0.4.54 ZIP retained for rollback.')
          PY
