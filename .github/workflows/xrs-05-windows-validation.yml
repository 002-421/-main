name: XRS-05 Windows integration validation

on:
  push:
    branches: [codex/xrs-05-integration-validation]
  pull_request:
    branches: [codex/mri-report-studio]
    paths:
      - 'x-ray-report-studio/**'
      - '.github/workflows/xrs-05-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-integration:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: x-ray-report-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: x-ray-report-studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Install checksum-verified Windows Electron runtime
        run: npm run desktop:install
      - name: Build application
        run: npm run build
      - name: Unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-output | Out-Null
          npm test 2>&1 | Tee-Object -FilePath test-output/windows-unit-tests.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $lines = Get-Content test-output/windows-unit-tests.log
            $failedTest = $lines | Where-Object { $_ -match '^✖ ' } | Select-Object -First 1
            $errorType = $lines | Where-Object { $_ -match '^\s*(AssertionError|TypeError|ReferenceError|SyntaxError|Error)( \[[^]]+\])?:' } | Select-Object -First 1
            $stackFrame = $lines | Where-Object { $_ -match '^\s+at .+\.mjs:\d+:\d+' } | Select-Object -First 1
            $summary = @($failedTest, ($errorType -replace '^\s*', ''), ($stackFrame -replace '^\s*', '')) -ne '' -join '; '
            Write-Output "::error title=Windows unit test diagnostic::$summary"
            exit $exitCode
          }
      - name: Validate Windows installer PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install_windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'install_windows.ps1 parsed without errors.'
      - name: Windows filesystem, shortcut, backup and rollback tests
        run: npm run test:windows-integration
      - name: Install Chromium for browser regression tests
        run: npx playwright-core install chromium
      - name: Document tab isolation regression
        run: npm run test:tab-isolation
      - name: Workspace recovery browser tests
        run: npm run test:workspace-recovery
      - name: Electron editor, DOCX/PDF and template integration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-output | Out-Null
          npm run test:browser 2>&1 | Tee-Object -FilePath test-output/windows-electron-integration.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $lines = Get-Content test-output/windows-electron-integration.log
            $failedTest = $lines | Where-Object { $_ -match '^✖ |^FAIL:' } | Select-Object -First 1
            $errorType = $lines | Where-Object { $_ -match '^\s*(AssertionError|TypeError|ReferenceError|SyntaxError|Error)( \[[^]]+\])?:' } | Select-Object -First 1
            $stackFrame = $lines | Where-Object { $_ -match '^\s+at .+\.(?:mjs|cjs):\d+:\d+' } | Select-Object -First 1
            $summary = (@($failedTest, ($errorType -replace '^\s*', ''), ($stackFrame -replace '^\s*', '')) | Where-Object { $_ }) -join '; '
            Write-Output "::error title=Electron integration diagnostic::$summary"
            exit $exitCode
          }
      - name: Electron Undo/Redo scroll regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-output | Out-Null
          npm run test:undo-scroll 2>&1 | Tee-Object -FilePath test-output/windows-undo-scroll.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $lines = Get-Content test-output/windows-undo-scroll.log
            $failedTest = $lines | Where-Object { $_ -match '^✖ |^FAIL:' } | Select-Object -First 1
            $errorType = $lines | Where-Object { $_ -match '^\s*(AssertionError|TypeError|ReferenceError|SyntaxError|Error)( \[[^]]+\])?:' } | Select-Object -First 1
            $stackFrame = $lines | Where-Object { $_ -match '^\s+at .+\.(?:mjs|cjs):\d+:\d+' } | Select-Object -First 1
            $summary = (@($failedTest, ($errorType -replace '^\s*', ''), ($stackFrame -replace '^\s*', '')) | Where-Object { $_ }) -join '; '
            Write-Output "::error title=Electron Undo/Redo diagnostic::$summary"
            exit $exitCode
          }
      - name: Build isolated Windows test kit
        run: npm run package:windows-test-kit
      - name: Upload isolated Windows test kit
        uses: actions/upload-artifact@v4
        with:
          name: XRS-05-Windows-Test-Kit
          path: x-ray-report-studio/test-output/XRS-05-Windows-Test-Kit.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows unit test diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XRS-05-Windows-test-diagnostic
          path: x-ray-report-studio/test-output/windows-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Windows Electron diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XRS-05-Windows-electron-diagnostics
          path: |
            x-ray-report-studio/test-output/windows-electron-integration.log
            x-ray-report-studio/test-output/windows-undo-scroll.log
          if-no-files-found: ignore
          retention-days: 7
